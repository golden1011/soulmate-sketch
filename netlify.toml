[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/thank-you"
  to = "/index.html"
  status = 200

# Mini CRM admin page — never indexed or cached
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The site publishes from the repo root, so keep server-side source files from being served as static files.
[[redirects]]
  from = "/db/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/drizzle.config.ts"
  to = "/index.html"
  status = 404
  force = true
