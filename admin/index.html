<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Leads · Naya Vale Studio</title>
<style>
:root{--bg:#f6f3ef;--card:#fff;--ink:#2b2230;--muted:#7a6f7f;--line:#e7e0e6;--plum:#5b2a6e;--plum2:#7b3d93;
  --new:#4a6fa5;--checkout:#c07a12;--paid:#1f8a4c;--delivered:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.35rem;margin:0}
h1 small{font-weight:400;color:var(--muted);font-size:.9rem;margin-left:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--plum2)}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.danger{color:#b42318}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--plum);color:#fff}
.bar input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:#fff}
.list{display:grid;gap:10px}
.lead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1.2fr 1.6fr 1.3fr;gap:14px}
.lead h3{margin:0 0 2px;font-size:1.05rem}
.meta{color:var(--muted);font-size:.83rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;color:#fff;vertical-align:middle}
.pill.new{background:var(--new)}.pill.checkout{background:var(--checkout)}.pill.paid{background:var(--paid)}.pill.delivered{background:var(--delivered)}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:.9rem}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.wa{color:var(--paid);text-decoration:none;font-weight:600}
.actions{display:flex;flex-direction:column;gap:8px}
.actions select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.actions textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:62px;resize:vertical;width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}
.saved{font-size:.78rem;color:var(--paid);min-height:1em}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{margin-bottom:6px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:14px 0 10px}
.err{color:#b42318;font-size:.88rem;min-height:1.2em}
@media (max-width:820px){.lead{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1>Naya Vale · Leads</h1>
  <div class="meta">Enter the admin password to view leads.</div>
  <form id="login-form"><input type="password" id="pw" autocomplete="current-password" placeholder="Admin password" required>
  <button class="btn primary" style="width:100%">Open</button></form>
  <p class="err" id="login-err"></p>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <h1>Leads <small id="updated"></small></h1>
    <div class="row">
      <button class="btn" id="refresh">↻ Refresh</button>
      <button class="btn" id="csv">⬇ Export CSV</button>
      <button class="btn" id="logout">Log out</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input type="search" id="q" placeholder="Search name, WhatsApp, email, notes…">
  </div>
  <div class="list" id="list"></div>
</div>

<script>
var STATUS = { new:'New lead', checkout:'Checkout started', paid:'Paid', delivered:'Delivered' };
var LANG = { en:'English', fr:'French', de:'German' };
var PKG = { basic:'Basic Sketch', complete:'Complete Vision' };
var leads = [], filter = 'all', pw = '';
try{ pw = sessionStorage.getItem('naya_admin_pw') || ''; }catch(e){}

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function when(t){ return t ? new Date(t).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : ''; }
function money(c,cur){ return c==null ? '' : (c/100).toLocaleString(undefined,{style:'currency',currency:(cur||'usd').toUpperCase()}); }

function api(method, body){
  return fetch('/api/admin/leads',{ method:method, headers:{'Authorization':'Bearer '+pw,'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if(!r.ok){ var e=new Error(d.error||('Error '+r.status)); e.status=r.status; throw e; } return d; }); });
}

function showLogin(msg){ $('app').hidden=true; $('login').hidden=false; $('login-err').textContent=msg||''; $('pw').focus(); }
function load(){
  return api('GET').then(function(d){
    leads=d.leads||[]; $('login').hidden=true; $('app').hidden=false;
    $('updated').textContent='· updated '+new Date().toLocaleTimeString(undefined,{timeStyle:'short'});
    render();
  }).catch(function(e){
    if(e.status===401){ try{ sessionStorage.removeItem('naya_admin_pw'); }catch(x){} pw=''; showLogin(e.message); }
    else if($('app').hidden) showLogin(e.message); else alert(e.message);
  });
}

function render(){
  var counts={all:leads.length,new:0,checkout:0,paid:0,delivered:0}, revenue=0, today=0, dayStart=new Date(); dayStart.setHours(0,0,0,0);
  leads.forEach(function(l){ counts[l.status]=(counts[l.status]||0)+1; if(l.amountCents && (l.status==='paid'||l.status==='delivered')) revenue+=l.amountCents; if(new Date(l.createdAt)>=dayStart) today++; });
  var buyers=counts.paid+counts.delivered;
  $('stats').innerHTML=[
    [counts.all,'Total leads'],[today,'Leads today'],[buyers,'Buyers ('+(counts.all?Math.round(buyers/counts.all*100):0)+'%)'],
    [counts.paid,'Paid — to deliver'],[counts.delivered,'Delivered'],[money(revenue,'usd'),'Revenue']
  ].map(function(s){ return '<div class="stat"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>'; }).join('');

  $('tabs').innerHTML=['all','new','checkout','paid','delivered'].map(function(k){
    return '<button data-f="'+k+'" class="'+(filter===k?'on':'')+'">'+(k==='all'?'All':STATUS[k])+' ('+(counts[k]||0)+')</button>'; }).join('');

  var q=$('q').value.trim().toLowerCase();
  var rows=leads.filter(function(l){
    if(filter!=='all' && l.status!==filter) return false;
    if(!q) return true;
    return [l.name,l.whatsapp,l.customerEmail,l.notes,l.ethnicity,l.utmSource,l.utmCampaign,l.utmContent,l.utmTerm,l.referrer].join(' ').toLowerCase().indexOf(q)>-1;
  });
  if(!rows.length){ $('list').innerHTML='<div class="empty">'+(leads.length?'No leads match this filter.':'No leads yet — they appear here as soon as someone finishes the quiz.')+'</div>'; return; }

  $('list').innerHTML=rows.map(function(l){
    var digits=(l.whatsapp||'').replace(/\D/g,'');
    var host=''; try{ host=l.referrer?new URL(l.referrer).host.replace(/^www\./,''):''; }catch(e){}
    var source=[l.utmSource,l.utmMedium].filter(Boolean).join(' / ') || (l.fbclid?'Facebook ad click':'') || (host?'Referral: '+host:'') || 'Direct / unknown';
    var ad=[['Campaign',l.utmCampaign],['Ad set',l.utmTerm],['Ad',l.utmContent]].filter(function(x){ return x[1]; });
    var timeline=[['Lead',l.createdAt],['Checkout',l.checkoutAt],['Paid',l.paidAt],['Delivered',l.deliveredAt]].filter(function(t){ return t[1]; })
      .map(function(t){ return t[0]+': '+when(t[1]); }).join('<br>');
    return '<div class="lead" data-id="'+esc(l.id)+'">'
      +'<div><h3>'+esc(l.name||'(no name)')+' <span class="pill '+esc(l.status)+'">'+esc(STATUS[l.status]||l.status)+'</span></h3>'
      +(digits?'<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+digits+'">💬 '+esc(l.whatsapp)+'</a>':'<span class="meta">No WhatsApp</span>')
      +(l.customerEmail?'<div class="meta">✉️ '+esc(l.customerEmail)+'</div>':'')
      +'<div class="meta" style="margin-top:6px">'+timeline+'</div></div>'
      +'<dl>'
      +'<dt>Interested in</dt><dd>'+esc(l.interest||'—')+'</dd>'
      +'<dt>Birth date</dt><dd>'+esc(l.dob||'—')+'</dd>'
      +'<dt>Background</dt><dd>'+esc(l.ethnicity||'—')+'</dd>'
      +'<dt>Package</dt><dd>'+esc(PKG[l.package]||l.package||'—')+(l.amountCents!=null?' · <b>'+esc(money(l.amountCents,l.currency))+'</b>':'')+'</dd>'
      +'<dt>Funnel</dt><dd>'+esc(LANG[l.language]||l.language)+'</dd>'
      +'<dt>Consent 18+</dt><dd>'+(l.consent?'Yes':'—')+'</dd>'
      +'<dt>Source</dt><dd>'+esc(source)+'</dd>'
      +ad.map(function(x){ return '<dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd>'; }).join('')
      +(l.stripeSessionId?'<dt>Stripe</dt><dd class="meta">'+esc(l.stripeSessionId.slice(0,24))+'…</dd>':'')
      +'</dl>'
      +'<div class="actions">'
      +'<div class="row"><select data-act="status">'+Object.keys(STATUS).map(function(k){ return '<option value="'+k+'"'+(l.status===k?' selected':'')+'>'+STATUS[k]+'</option>'; }).join('')+'</select>'
      +(l.status!=='delivered'?'<button class="btn primary" data-act="deliver">✓ Mark delivered</button>':'')+'</div>'
      +'<textarea data-act="notes" placeholder="Notes (saved automatically)">'+esc(l.notes)+'</textarea>'
      +'<div class="row" style="justify-content:space-between"><span class="saved"></span><button class="btn danger" data-act="delete">Delete</button></div>'
      +'</div></div>';
  }).join('');
}

function update(id, patch, el){
  return api('PATCH', Object.assign({id:id}, patch)).then(function(d){
    leads=leads.map(function(l){ return l.id===id ? d.lead : l; });
    if(patch.status) render();
    else if(el){ var s=el.closest('.lead').querySelector('.saved'); s.textContent='Saved'; setTimeout(function(){ s.textContent=''; },1500); }
  }).catch(function(e){ alert('Could not save: '+e.message); });
}

$('login-form').addEventListener('submit', function(e){
  e.preventDefault(); pw=$('pw').value; try{ sessionStorage.setItem('naya_admin_pw', pw); }catch(x){} load();
});
$('logout').addEventListener('click', function(){ try{ sessionStorage.removeItem('naya_admin_pw'); }catch(e){} pw=''; leads=[]; $('pw').value=''; showLogin(); });
$('refresh').addEventListener('click', load);
$('q').addEventListener('input', render);
$('tabs').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b){ filter=b.dataset.f; render(); } });
$('list').addEventListener('change', function(e){
  var id=e.target.closest('.lead').dataset.id;
  if(e.target.dataset.act==='status') update(id,{status:e.target.value});
  if(e.target.dataset.act==='notes') update(id,{notes:e.target.value}, e.target);
});
$('list').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return; var id=b.closest('.lead').dataset.id;
  if(b.dataset.act==='deliver') update(id,{status:'delivered'});
  if(b.dataset.act==='delete' && confirm('Delete this lead permanently?')){
    api('DELETE',{id:id}).then(function(){ leads=leads.filter(function(l){ return l.id!==id; }); render(); }).catch(function(e){ alert(e.message); });
  }
});
$('csv').addEventListener('click', function(){
  var cols=['createdAt','status','name','whatsapp','customerEmail','interest','dob','ethnicity','package','amountCents','currency','language','consent',
    'checkoutAt','paidAt','deliveredAt','utmSource','utmMedium','utmCampaign','utmContent','utmTerm','fbclid','referrer','landingUrl','stripeSessionId','notes','id'];
  var cell=function(v){ v=v==null?'':String(v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };
  var csv=[cols.join(',')].concat(leads.map(function(l){ return cols.map(function(c){ return cell(l[c]); }).join(','); })).join('\r\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download='naya-leads-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
});

if(pw) load(); else showLogin();
</script>
</body>
</html>
