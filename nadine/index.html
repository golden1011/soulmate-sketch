<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Merci pour votre commande — Naya Vale</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fdf8f0;
      --navy: #16263f;
      --ink: #2c3646;
      --line: #e7e0d2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
      color: var(--ink);
      font: 1.125rem/1.55 'Source Sans 3', sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 220px);
      align-items: center;
      gap: clamp(24px, 5vw, 56px);
      width: min(100%, 740px);
      padding: clamp(24px, 6vw, 52px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgb(22 38 63 / 8%);
    }
    .signature {
      margin: 0 0 12px;
      color: #82485a;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      color: var(--navy);
      font: 700 clamp(1.85rem, 5vw, 2.8rem)/1.12 'Playfair Display', Georgia, serif;
    }
    p { margin: 0; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 50% 50% 10px 10px;
    }
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
      img { width: min(70%, 200px); }
    }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="signature">Naya Vale</p>
      <h1>Merci pour votre commande&nbsp;!</h1>
      <p>Vous recevrez votre formule complète sur WhatsApp dans un délai de <strong>6 heures</strong>.</p>
    </div>
    <img src="/assets/img/1e29cddeaa49.webp" width="1600" height="1600" alt="Portrait de Naya Vale">
  </main>
  <script>
    (() => {
      const productionHosts = ['nayavale.com', 'www.nayavale.com'];
      if (!productionHosts.includes(window.location.hostname)) return;
      if (!/(?:^|;\s*)_fb[pc]=[^;\s]+/.test(document.cookie)) return;

      const eventId = 'naya-manual-order-001';
      const purchaseKey = 'naya_purchase_' + eventId;
      try {
        if (localStorage.getItem(purchaseKey)) return;
      } catch {
        return;
      }

      const pixel = function () {
        if (pixel.callMethod) pixel.callMethod.apply(pixel, arguments);
        else pixel.queue.push(arguments);
      };
      window.fbq = window._fbq = pixel;
      pixel.push = pixel;
      pixel.loaded = true;
      pixel.version = '2.0';
      pixel.queue = [];

      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://connect.facebook.net/en_US/fbevents.js';
      script.addEventListener('load', () => {
        try {
          if (localStorage.getItem(purchaseKey)) return;
          localStorage.setItem(purchaseKey, '1');
        } catch {
          return;
        }
        pixel('init', '2396469624443898');
        pixel('track', 'Purchase', { value: 30, currency: 'EUR' }, { eventID: eventId });
      }, { once: true });
      document.head.append(script);
    })();
  </script>
</body>
</html>
